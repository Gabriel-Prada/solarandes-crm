[project]
name = "solarandes"
version = "0.1.0"
requires-python = ">=3.13"

[tool.pytest.ini_options]
pythonpath = ["scripts/datos", "scripts/supabase", "scripts/migracion", "scripts/n8n", "scripts/evals"]
